# CoE ImageSet — OpenShift 4.21.27 + OCP-V
# Trimmed from community reference: eanylin/openshift-lab imageset-config-4.21.27.yaml
# Use for partner CoE / demo mirrors. For minimal install use imageset-config.yaml.template
#
# Intentionally excludes MTV/forklift — add mtv-operator to mirror.operators.packages
# before mirroring if the customer needs VMware workload migration.
#
# Apply: oc mirror -c mirror/imageset-ocpv-coe.yaml --workspace file://${OC_MIRROR_WORKDIR} --v2

kind: ImageSetConfiguration
apiVersion: mirror.openshift.io/v2alpha1
mirror:
  platform:
    channels:
      - name: stable-4.21
        minVersion: 4.21.27
        maxVersion: 4.21.27
        type: ocp
    graph: true
  operators:
    - catalog: registry.redhat.io/redhat/redhat-operator-index:v4.21
      packages:
        - name: kubevirt-hyperconverged
          channels:
            - name: stable
        - name: kubernetes-nmstate-operator
          channels:
            - name: stable
        - name: lvms-operator
          channels:
            - name: stable-4.21
        - name: local-storage-operator
          channels:
            - name: stable
        - name: openshift-cert-manager-operator
          channels:
            - name: stable-v1
  additionalImages:
    - name: registry.redhat.io/rhel9/rhel-guest-image:latest
    - name: registry.redhat.io/ubi9/ubi:latest
    - name: quay.io/containerdisks/centos-stream:9
