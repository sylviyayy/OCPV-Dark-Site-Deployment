apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    machineconfiguration.openshift.io/role: master
  name: 99-master-dns-production
spec:
  config:
    ignition:
      version: 3.2.0
    storage:
      files:
        - contents:
            source: data:text/plain;charset=utf-8,search%20BASE_DOMAIN%0Enameserver%20DNS_VM_IP%0E
          mode: 420
          path: /etc/resolv.conf
          overwrite: true
---
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    machineconfiguration.openshift.io/role: worker
  name: 99-worker-dns-production
spec:
  config:
    ignition:
      version: 3.2.0
    storage:
      files:
        - contents:
            source: data:text/plain;charset=utf-8,search%20BASE_DOMAIN%0Enameserver%20DNS_VM_IP%0E
          mode: 420
          path: /etc/resolv.conf
          overwrite: true
