#version=RHEL9
# Bastion host kickstart for dark site OCP-V deployment
# Static IP, MVP DNS/NTP packages, installer tools

# Install from local media (no network repo)
cdrom
text
reboot

# Language and keyboard
lang en_US.UTF-8
keyboard us
timezone UTC --utc

# Network — static IP on primary NIC
network --bootproto=static --device=ens192 --ip=10.10.0.5 --netmask=255.255.0.0 --gateway=10.10.0.1 --hostname=bastion.ocp-v.local --onboot=on --nameserver=127.0.0.1

# Disk partitioning — use entire disk
clearpart --all --initlabel
autopart --type=lvm --nohome

# Bootloader
bootloader --location=mbr --append="crashkernel=auto"

# Root password (CHANGE BEFORE USE)
rootpw --plaintext changeme-rootpw

# Create installer user
user --name=installer --groups=wheel --password=changeme-installer --plaintext

# SSH key for installer (replace with your key)
sshkey --username=installer "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC... installer@staging"

# Packages
%packages
@^minimal-environment
git
jq
podman
skopeo
bind-utils
chrony
dnsmasq
firewalld
nmstate
tar
wget
curl
openshift-clients
nmstate
%end

# Post-install scripts
%post --log=/root/ks-post.log
#!/bin/bash
set -eux

# Static hosts file (no DNS available yet)
cat >> /etc/hosts <<'HOSTS'
10.10.0.1   gw.ocp-v.local gw
10.10.0.5   bastion.ocp-v.local bastion
10.10.0.10  registry.ocp-v.local registry
10.10.0.100 api.ocpv-lab.ocp-v.local api api-int.ocpv-lab.ocp-v.local api-int
10.10.0.101 console-openshift-console.apps.ocpv-lab.ocp-v.local
10.10.1.11  cp01.ocp-v.local cp01
10.10.1.12  cp02.ocp-v.local cp02
10.10.1.13  cp03.ocp-v.local cp03
10.10.2.21  wk01.ocp-v.local wk01
10.10.2.22  wk02.ocp-v.local wk02
HOSTS

# Configure chronyd as local NTP server (orphan mode)
cat > /etc/chrony.conf <<'CHRONY'
local stratum 10 orphan
allow 10.10.0.0/16
bindaddress 10.10.0.5
makestep 1.0 3
rtcsync
driftfile /var/lib/chrony/drift
logdir /var/log/chrony
CHRONY

systemctl enable chronyd

# dnsmasq installed but NOT started — enabled by bootstrap script
systemctl disable dnsmasq

# Firewall — open SSH, DNS, NTP
systemctl enable firewalld
firewall-cmd --permanent --add-service=ssh
firewall-cmd --permanent --add-service=dns
firewall-cmd --permanent --add-service=ntp
firewall-cmd --reload

# Create mirror directory
mkdir -p /opt/ocp-mirror
chown installer:installer /opt/ocp-mirror

# Clone deployment repo (if available on USB)
if [ -d /run/install/repo/OCPV-Dark-Site-Deployment ]; then
  cp -r /run/install/repo/OCPV-Dark-Site-Deployment /home/installer/
  chown -R installer:installer /home/installer/OCPV-Dark-Site-Deployment
fi

%end

# Disable firstboot
firstboot --disable
