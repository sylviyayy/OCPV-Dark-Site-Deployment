#version=RHEL9
# Mirror registry host kickstart for dark site OCP-V deployment

cdrom
text
reboot

lang en_US.UTF-8
keyboard us
timezone UTC --utc

network --bootproto=static --device=ens192 --ip=10.10.0.10 --netmask=255.255.0.0 --gateway=10.10.0.1 --hostname=registry.ocp-v.local --onboot=on --nameserver=10.10.0.5

clearpart --all --initlabel
autopart --type=lvm --nohome

bootloader --location=mbr --append="crashkernel=auto"

rootpw --plaintext changeme-rootpw

user --name=installer --groups=wheel --password=changeme-installer --plaintext
sshkey --username=installer "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC... installer@staging"

%packages
@^minimal-environment
podman
skopeo
httpd
openssl
firewalld
chrony
bind-utils
tar
%end

%post --log=/root/ks-post.log
#!/bin/bash
set -eux

# Static hosts
cat >> /etc/hosts <<'HOSTS'
10.10.0.5   bastion.ocp-v.local bastion
10.10.0.10  registry.ocp-v.local registry
HOSTS

# Point NTP to bastion
cat > /etc/chrony.conf <<'CHRONY'
server 10.10.0.5 iburst
driftfile /var/lib/chrony/drift
makestep 1.0 3
rtcsync
logdir /var/log/chrony
CHRONY
systemctl enable chronyd

# Prepare registry directories
mkdir -p /opt/registry/data
mkdir -p /opt/registry/certs
chown -R installer:installer /opt/registry

# Generate self-signed TLS cert for registry
openssl req -newkey rsa:4096 -nodes -sha256 \
  -keyout /opt/registry/certs/domain.key \
  -x509 -days 3650 \
  -out /opt/registry/certs/domain.crt \
  -subj "/CN=registry.ocp-v.local" \
  -addext "subjectAltName=DNS:registry.ocp-v.local,IP:10.10.0.10"

# Serve CA cert via httpd for nodes to download
mkdir -p /var/www/html/certs
cp /opt/registry/certs/domain.crt /var/www/html/certs/registry-ca.crt
systemctl enable httpd

# Firewall
systemctl enable firewalld
firewall-cmd --permanent --add-service=ssh
firewall-cmd --permanent --add-port=5000/tcp
firewall-cmd --permanent --add-service=http
firewall-cmd --reload

%end

firstboot --disable
